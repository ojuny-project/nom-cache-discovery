name: All checks via Nix
on:
  pull_request:
  push:
    branches: [main]

run-name: Test and build flake
jobs:
  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31
      # INVENTORY: package.4.1
      # INVENTORY: package.4.2
      # INVENTORY: package.4.3
      # INVENTORY: package.4.5
      - run: nix flake check
